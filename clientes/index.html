<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Seguros Generales</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: auto;
        }
        h1 { color: #0056b3; margin-bottom: 10px; }
        p { color: #666; font-size: 16px; line-height: 1.5; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover { background-color: #004494; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AM Seguros Generales</h1>
        <p>Asesoría y gestión integral de seguros. Pronto habilitaremos nuestro sitio web completo.</p>
        <p>Si eres cliente y necesitas consultar tus pólizas, ingresa al portal exclusivo:</p>
        <a href="/clientes/" class="btn">Acceder al Portal de Clientes</a>
    </div>
</body>
</html>
